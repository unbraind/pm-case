name: CI Deep

on:
  push:
    branches: [main]
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    name: deep (${{ matrix.major }})
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '22.19.0'
            major: 22
          - node-version: '26.13.0'
            major: 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Provision minimum acceptance runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.19.0

      - name: Retain minimum acceptance runtime
        run: echo "PM_CASE_NODE_22=$(command -v node)" >> "$GITHUB_ENV"

      - name: Provision current acceptance runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      - name: Retain current acceptance runtime
        run: echo "PM_CASE_NODE_26=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Setup Bun
        if: runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Bun version
        run: bun --version

      - name: Install dependencies
        run: npm ci

      - name: Full npm release gate
        run: npm run release:check

      - name: Full Bun release gate
        run: bun run release:check

      - name: Bun package graph smoke
        run: bun install --no-save
